<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile - Expense Tracker</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .profile-page {

            padding: 30px;

            max-width: 900px;

            margin: auto;

        }

        .profile-card {

            background: white;

            border-radius: 14px;

            padding: 30px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);

            margin-bottom: 25px;

        }

        .profile-header {

            display: flex;

            align-items: center;

            gap: 20px;

            margin-bottom: 30px;

        }

        .profile-avatar {

            width: 75px;

            height: 75px;

            border-radius: 50%;

            background: #17245c;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 30px;

            font-weight: bold;

        }

        .profile-header h2 {

            margin: 0 0 5px;

        }

        .profile-header p {

            margin: 0;

            color: #777;

        }

        .form-group {

            margin-bottom: 18px;

        }

        .form-group label {

            display: block;

            margin-bottom: 7px;

            font-weight: 600;

            color: #333;

        }

        .form-group input,

        .form-group select {

            width: 100%;

            padding: 12px;

            border: 1px solid #ddd;

            border-radius: 8px;

            font-size: 14px;

            box-sizing: border-box;

        }

        .form-group input:focus,

        .form-group select:focus {

            outline: none;

            border-color: #17245c;

        }

        .profile-btn {

            border: none;

            padding: 12px 20px;

            border-radius: 8px;

            background: #17245c;

            color: white;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

        }

        .profile-btn:hover {

            background: #25377d;

        }

        .danger-btn {

            background: #dc3545;

        }

        .danger-btn:hover {

            background: #b02a37;

        }

        .section-title {

            margin-top: 0;

            margin-bottom: 20px;

            color: #17245c;

        }

        .profile-info {

            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 18px;

            margin-bottom: 25px;

        }

        .info-box {

            background: #f7f8fc;

            padding: 16px;

            border-radius: 10px;

        }

        .info-box span {

            display: block;

            color: #777;

            font-size: 13px;

            margin-bottom: 5px;

        }

        .info-box strong {

            font-size: 15px;

            color: #222;

        }

        .message {

            margin-top: 15px;

            font-size: 14px;

            font-weight: 600;

        }

        @media (max-width: 700px) {

            .profile-page {

                padding: 15px;

            }

            .profile-info {

                grid-template-columns: 1fr;

            }

            .profile-header {

                align-items: flex-start;

            }

        }

    </style>

</head>

<body>

    <div class="profile-page">

        <!-- PROFILE HEADER -->

        <div class="profile-card">

            <div class="profile-header">

                <div class="profile-avatar" id="profileAvatar">

                    U

                </div>

                <div>

                    <h2 id="profileName">Loading...</h2>

                    <p id="profileEmail">Loading...</p>

                </div>

            </div>

            <!-- PROFILE INFORMATION -->

            <div class="profile-info">

                <div class="info-box">

                    <span>Name</span>

                    <strong id="displayName">Loading...</strong>

                </div>

                <div class="info-box">

                    <span>Email</span>

                    <strong id="displayEmail">Loading...</strong>

                </div>

                <div class="info-box">

                    <span>Account Created</span>

                    <strong id="displayCreatedAt">Loading...</strong>

                </div>

                <div class="info-box">

                    <span>Currency</span>

                    <strong id="displayCurrency">INR</strong>

                </div>

            </div>

        </div>


        <!-- EDIT PROFILE -->

        <div class="profile-card">

            <h2 class="section-title">Edit Profile</h2>

            <form id="profileForm">

                <div class="form-group">

                    <label for="name">Name</label>

                    <input

                        type="text"

                        id="name"

                        placeholder="Enter your name"

                        required

                    >

                </div>

                <div class="form-group">

                    <label for="email">Email</label>

                    <input

                        type="email"

                        id="email"

                        placeholder="Enter your email"

                        required

                    >

                </div>

                <button type="submit" class="profile-btn">

                    Save Changes

                </button>

            </form>

            <div id="profileMessage" class="message"></div>

        </div>


        <!-- CURRENCY SETTINGS -->

        <div class="profile-card">

            <h2 class="section-title">Currency Preference</h2>

            <div class="form-group">

                <label for="currencySelect">

                    Select Currency

                </label>

                <select id="currencySelect">

                    <option value="INR">

                        ₹ Indian Rupee (INR)

                    </option>

                    <option value="USD">

                        $ US Dollar (USD)

                    </option>

                    <option value="EUR">

                        € Euro (EUR)

                    </option>

                </select>

            </div>

            <p style="color:#777;font-size:13px;">

                This changes how amounts are displayed in the application.

            </p>

        </div>


        <!-- CHANGE PASSWORD -->

        <div class="profile-card">

            <h2 class="section-title">

                Change Password

            </h2>

            <form id="passwordForm">

                <div class="form-group">

                    <label for="currentPassword">

                        Current Password

                    </label>

                    <input

                        type="password"

                        id="currentPassword"

                        placeholder="Enter current password"

                        required

                    >

                </div>

                <div class="form-group">

                    <label for="newPassword">

                        New Password

                    </label>

                    <input

                        type="password"

                        id="newPassword"

                        placeholder="Enter new password"

                        required

                    >

                </div>

                <div class="form-group">

                    <label for="confirmPassword">

                        Confirm New Password

                    </label>

                    <input

                        type="password"

                        id="confirmPassword"

                        placeholder="Confirm new password"

                        required

                    >

                </div>

                <button

                    type="submit"

                    class="profile-btn"

                >

                    Change Password

                </button>

            </form>

            <div id="passwordMessage" class="message"></div>

        </div>


        <!-- LOGOUT -->

        <div class="profile-card">

            <h2 class="section-title">

                Account

            </h2>

            <button

                id="logoutBtn"

                class="profile-btn danger-btn"

            >

                Logout

            </button>

        </div>

    </div>


<script>

    /* ===============================
       BACKEND URL
    =============================== */

    const API_BASE =
        "https://expense-tracker-backend-0sta.onrender.com/api";


    /* ===============================
       CHECK LOGIN
    =============================== */

    const token = localStorage.getItem("token");

    if (!token) {

        window.location.href = "login.html";

    }


    /* ===============================
       LOAD PROFILE
    =============================== */

    async function loadProfile() {

        try {

            const response = await fetch(

                "https://expense-tracker-backend-0sta.onrender.com/api/auth/me",

                {

                    method: "GET",

                    headers: {

                        "Authorization":
                            "Bearer " + token

                    }

                }

            );


            if (!response.ok) {

                localStorage.removeItem("token");

                localStorage.removeItem("loggedInUser");

                window.location.href =
                    "login.html";

                return;

            }


            const user = await response.json();


            /* HEADER */

            document.getElementById("profileName").textContent =
                user.name || "User";

            document.getElementById("profileEmail").textContent =
                user.email || "";


            /* AVATAR */

            const firstLetter =
                (user.name || "U")
                    .charAt(0)
                    .toUpperCase();

            document.getElementById("profileAvatar").textContent =
                firstLetter;


            /* PROFILE INFORMATION */

            document.getElementById("displayName").textContent =
                user.name || "-";

            document.getElementById("displayEmail").textContent =
                user.email || "-";


            /* CREATED DATE */

            if (user.created_at) {

                const date =
                    new Date(user.created_at);

                document.getElementById("displayCreatedAt").textContent =
                    date.toLocaleDateString("en-IN");

            } else {

                document.getElementById("displayCreatedAt").textContent =
                    "-";

            }


            /* FORM VALUES */

            document.getElementById("name").value =
                user.name || "";

            document.getElementById("email").value =
                user.email || "";


            /* SAVE USER */

            localStorage.setItem(

                "loggedInUser",

                JSON.stringify(user)

            );

        } catch (error) {

            console.error(
                "Profile loading error:",
                error
            );

            document.getElementById(
                "profileMessage"
            ).textContent =
                "Unable to load profile.";

            document.getElementById(
                "profileMessage"
            ).style.color =
                "#dc3545";

        }

    }


    /* ===============================
       EDIT PROFILE
    =============================== */

    document
        .getElementById("profileForm")
        .addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const name =
                    document
                        .getElementById("name")
                        .value
                        .trim();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                if (!name || !email) {

                    showProfileMessage(

                        "Name and email are required.",

                        false

                    );

                    return;

                }


                const emailRegex =
                    /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


                if (!emailRegex.test(email)) {

                    showProfileMessage(

                        "Please enter a valid email address.",

                        false

                    );

                    return;

                }


                try {

                    const response =
                        await fetch(

                            "https://expense-tracker-backend-0sta.onrender.com/api/auth/profile",

                            {

                                method: "PUT",

                                headers: {

                                    "Content-Type":
                                        "application/json",

                                    "Authorization":
                                        "Bearer " + token

                                },

                                body: JSON.stringify({

                                    name: name,

                                    email: email

                                })

                            }

                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        showProfileMessage(

                            data.message ||
                            "Failed to update profile.",

                            false

                        );

                        return;

                    }


                    showProfileMessage(

                        "Profile updated successfully.",

                        true

                    );


                    localStorage.setItem(

                        "loggedInUser",

                        JSON.stringify(
                            data.user
                        )

                    );


                    loadProfile();


                } catch (error) {

                    console.error(
                        "Profile update error:",
                        error
                    );

                    showProfileMessage(

                        "Something went wrong. Please try again.",

                        false

                    );

                }

            }

        );


    /* ===============================
       PROFILE MESSAGE
    =============================== */

    function showProfileMessage(
        message,
        success
    ) {

        const element =
            document.getElementById(
                "profileMessage"
            );


        element.textContent =
            message;


        element.style.color =
            success
                ? "#198754"
                : "#dc3545";

    }


    /* ===============================
       CURRENCY
    =============================== */

    const currencySelect =
        document.getElementById(
            "currencySelect"
        );


    const savedCurrency =
        localStorage.getItem("currency") ||
        "INR";


    currencySelect.value =
        savedCurrency;


    updateCurrencyDisplay(
        savedCurrency
    );


    currencySelect.addEventListener(

        "change",

        function () {

            localStorage.setItem(

                "currency",

                this.value

            );


            updateCurrencyDisplay(

                this.value

            );


            alert(

                "Currency changed to " +
                this.value

            );

        }

    );


    function updateCurrencyDisplay(
        currency
    ) {

        const currencyNames = {

            INR: "INR",

            USD: "USD",

            EUR: "EUR"

        };


        document.getElementById(

            "displayCurrency"

        ).textContent =

            currencyNames[currency] ||
            "INR";

    }


    /* ===============================
       CHANGE PASSWORD
    =============================== */

    document
        .getElementById("passwordForm")
        .addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const currentPassword =
                    document.getElementById(
                        "currentPassword"
                    ).value;


                const newPassword =
                    document.getElementById(
                        "newPassword"
                    ).value;


                const confirmPassword =
                    document.getElementById(
                        "confirmPassword"
                    ).value;


                if (

                    !currentPassword ||

                    !newPassword ||

                    !confirmPassword

                ) {

                    showPasswordMessage(

                        "Please fill all password fields.",

                        false

                    );

                    return;

                }


                if (newPassword.length < 6) {

                    showPasswordMessage(

                        "New password must be at least 6 characters.",

                        false

                    );

                    return;

                }


                if (
                    newPassword !==
                    confirmPassword
                ) {

                    showPasswordMessage(

                        "New passwords do not match.",

                        false

                    );

                    return;

                }


                try {

                    const response =
                        await fetch(

                            "https://expense-tracker-backend-0sta.onrender.com/api/auth/change-password",

                            {

                                method: "PUT",

                                headers: {

                                    "Content-Type":
                                        "application/json",

                                    "Authorization":
                                        "Bearer " + token

                                },

                                body: JSON.stringify({

                                    currentPassword:
                                        currentPassword,

                                    newPassword:
                                        newPassword

                                })

                            }

                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        showPasswordMessage(

                            data.message ||
                            "Failed to change password.",

                            false

                        );

                        return;

                    }


                    showPasswordMessage(

                        "Password changed successfully.",

                        true

                    );


                    document
                        .getElementById(
                            "passwordForm"
                        )
                        .reset();


                } catch (error) {

                    console.error(

                        "Password change error:",

                        error

                    );


                    showPasswordMessage(

                        "Something went wrong. Please try again.",

                        false

                    );

                }

            }

        );


    /* ===============================
       PASSWORD MESSAGE
    =============================== */

    function showPasswordMessage(

        message,

        success

    ) {

        const element =
            document.getElementById(
                "passwordMessage"
            );


        element.textContent =
            message;


        element.style.color =
            success

                ? "#198754"

                : "#dc3545";

    }


    /* ===============================
       LOGOUT
    =============================== */

    document
        .getElementById("logoutBtn")
        .addEventListener(

            "click",

            function () {

                localStorage.removeItem(
                    "token"
                );


                localStorage.removeItem(
                    "loggedInUser"
                );


                window.location.href =
                    "login.html";

            }

        );


    /* ===============================
       START
    =============================== */

    loadProfile();

</script>

</body>

</html>
